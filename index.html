<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen de Diseño de sitios web II</title>
    <link rel="stylesheet" href="/public/css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
</head>

<body>
    <!-- nav bar -->
    <nav class="nav-container">
        <div>
            <img src="public/assets/svg/Logo.svg" alt="Logo de treine.me">
        </div>
        <div class ="nav-info">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Training</a>
        </div>
    </nav>

    <!--hero-->
    <section class="hero">
        <div class="hero-container">
            <h1>WORKOUTS MADE <span>EXCLUSIVE</span> FOR YOU!</h1>
            <p>We create exclusive and unique workouts for you. 
            Invest in your body and get much more performance
            and quality of life.</p>
            <button class="btn-verde">
                <img class="icon-wa" src="public/assets/img/logo_wa.png" alt="Logo de Whatssapp">
                <p>Start now</p>
            </button>
        </div>
        <div class="fitness-img">
            <img src="public/assets/img/fitness-jump.png" alt="Chica usando mancuernas">
        </div>
    </section>

    <!--footer-->
    <footer class="footer">
        <p>send us a message <span>@treine.me</span></p>
        <img class="img-footer" src="public/assets/svg/balls-decoration.svg" alt="Decoracion inferior derecha">
    </footer>
</body>
</html>
